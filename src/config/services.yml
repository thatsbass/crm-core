services:
  authController:
    class: '../modules/auth/auth.controller'
    export: AuthController
    arguments:
      - '@authService'

  authService:
    class: '../modules/auth/auth.service'
    export: AuthService

  clientController:
    class: '../modules/clients/client.controller'
    export: ClientController
    arguments:
      - '@clientService'

  clientService:
    class: '../modules/clients/client.service'
    export: ClientService
    arguments:
      - '@loggerService'

  loggerService:
    class: '../modules/logs/log.service'
    export: LoggerService

  logController:
    class: '../modules/logs/log.controller'
    export: LogController
    arguments:
      - '@loggerService'
