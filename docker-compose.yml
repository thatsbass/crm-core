version: '3.8'

services:
  gest-client:
    build: . 
    ports:
      - "5000:3000"
    env_file:
      - .env 
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge